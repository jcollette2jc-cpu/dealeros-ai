name: DealerOS verification

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/inventory-crud
      - agent/inventory-smoke-tests
      - agent/dealerclick-csv-import
      - agent/real-inventory-compatibility

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: file:./dev.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run inventory CRUD smoke test
        run: npx tsx scripts/inventory-smoke-test.ts

      - name: Run DealerClick CSV parser smoke test
        run: npx tsx scripts/csv-import-smoke-test.ts

      - name: Seed demonstration inventory
        run: npm run db:seed

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify running application pages
        shell: bash
        run: |
          npm start > /tmp/dealeros-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /tmp/dashboard.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/inventory > /tmp/inventory.html
          curl --fail --silent http://127.0.0.1:3000/inventory/new > /tmp/new-vehicle.html
          curl --fail --silent http://127.0.0.1:3000/inventory/import > /tmp/import.html
          vehicle_path=$(grep -oE '/inventory/[0-9]+' /tmp/inventory.html | head -n 1)
          test -n "$vehicle_path"
          curl --fail --silent "http://127.0.0.1:3000$vehicle_path" > /tmp/vehicle-detail.html
          grep -q "DealerOS AI Command Center" /tmp/dashboard.html
          grep -q "Inventory Intelligence" /tmp/inventory.html
          grep -q "Add Vehicle" /tmp/new-vehicle.html
          grep -q "Import DealerClick Inventory" /tmp/import.html
          grep -q "Vehicle Details" /tmp/vehicle-detail.html
